name: Update NHL stats

on:
  schedule:
    - cron: "15 7 * * *"
    - cron: "15 8 * * *"
    - cron: "30 11 * * 0"
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: "Rebuild every regular-season game from official NHL boxscores"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: nhl-data-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh official NHL goal ledger
        shell: bash
        run: |
          if [ "${{ github.event.schedule }}" = "30 11 * * 0" ] || [ "${{ inputs.full_rebuild }}" = "true" ]; then
            python scripts/update_stats.py --full
          else
            python scripts/update_stats.py
          fi

      - name: Commit updated data
        run: |
          git config user.name "nhl-strelci-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/league.json data/stats.json data/history.json data/game_ledger.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Official NHL boxscore stats update"
            git push
          fi
