name: Update NHL stats

on:
  schedule:
  - cron: "15 7 * * *"
  - cron: "15 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch NHL regular-season stats
        run: python scripts/update_stats.py

      - name: Commit updated data
        run: |
          git config user.name "nhl-strelci-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/stats.json data/history.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Daily NHL stats update"
            git push
          fi
