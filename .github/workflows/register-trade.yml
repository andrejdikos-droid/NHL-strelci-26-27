name: Register trade

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: nhl-data-writes
  cancel-in-progress: false

jobs:
  register:
    if: >
      github.event.issue.user.login == 'andrejdikos-droid' &&
      (startsWith(github.event.issue.title, '[TRADE]') ||
       startsWith(github.event.issue.title, '[TRADE-TEST]'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh official goal ledger before trade
        run: python scripts/update_stats.py

      - name: Validate / register trade
        run: python scripts/apply_trade.py

      - name: Rebuild standings after real trade
        if: ${{ !startsWith(github.event.issue.title, '[TRADE-TEST]') }}
        run: python scripts/update_stats.py

      - name: Commit real trade
        if: ${{ !startsWith(github.event.issue.title, '[TRADE-TEST]') }}
        run: |
          git config user.name "nhl-strelci-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/league.json data/trades.json data/stats.json data/history.json data/game_ledger.json
          git commit -m "Register trade from issue #${{ github.event.issue.number }}"
          git push

      - name: Close real trade request
        if: ${{ success() && !startsWith(github.event.issue.title, '[TRADE-TEST]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --comment "✅ Trejd bol zaregistrovaný z oficiálneho NHL game-ledgeru. Dashboard sa po deployi automaticky aktualizuje."

      - name: Close successful dry run
        if: ${{ success() && startsWith(github.event.issue.title, '[TRADE-TEST]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --comment "✅ DRY RUN prešiel. Roster ani počet trejdov sa nezmenil."
