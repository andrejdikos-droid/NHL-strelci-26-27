name: Register trade

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  register:
    if: startsWith(github.event.issue.title, '[TRADE]') && github.event.issue.user.login == 'andrejdikos-droid'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Register trade
        run: python scripts/apply_trade.py

      - name: Refresh NHL stats and team totals
        run: python scripts/update_stats.py

      - name: Commit trade
        run: |
          git config user.name "nhl-strelci-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/league.json data/trades.json data/stats.json data/history.json
          git commit -m "Register trade from issue #${{ github.event.issue.number }}"
          git push

      - name: Close trade request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --comment "✅ Trejd bol zaregistrovaný. Dashboard sa po GitHub Pages deployi automaticky aktualizuje."
